<h1>第七部完　作者的話</h1>
<hr>
<p>寫完了。</p>
<p>五十二年。從中平元年到青龍四年。從兩個老頭穿越——到一個走了、一個留著。</p>
<p>七部。三百多章。</p>
<p>一個穿越者能做的所有事——都做了。然後——安安靜靜地——走了。</p>
<hr>
<p>全書只有兩句話是真正的結局：</p>
<p>「活下來了。」</p>
<p>「嗯。活下來了。」</p>
<p>不是慶祝。不是感慨。</p>
<p>只是——確認。</p>
<hr>
<p>謝謝你讀到這裡。</p>
<p>——不賢良師</p>
