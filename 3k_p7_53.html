<h1>第五十三章　活</h1>
<hr>
<p>不標時間。不標地點。</p>
<hr>
<p>風。</p>
<p>從太行山上吹下來的風。穿過松林。穿過谷地。穿過田野。穿過城牆。穿過街巷。穿過學堂的窗。穿過鐵坊的門。穿過醫館的簾。</p>
<p>吹過所有活著的人。</p>
<hr>
<p>「活下來了。」</p>
<p>「嗯。活下來了。」</p>
<hr>
<p>（全書完）</p>
