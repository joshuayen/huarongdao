<h1>劉備前傳</h1>
<div class="subtitle">不賢良師　著</div>

<hr>

<p>中山靖王之後。織席販履。少語言。善下人。喜怒不形於色。</p>

<p>他到底是真的——還是裝的？</p>

<p>本書不給答案。</p>

<div class="ending">
你覺得是什麼——就是什麼。
</div>
