<div class="book-card">
<h2>華容道</h2>
<p class="desc">兩個七十歲的現代老頭——一個廟公、一個中醫——穿越到黃巾起義前夕，附身在張角和華佗身上。沒有主角光環，只有七十年的人生閱歷和活下去的執念。三國穿越，七部完結，約三十萬字。</p>

<div class="book-card">
<h2>蒼天</h2>
<p class="desc">華容道前傳。寫的是穿越之前真正的張角——一個農家子弟如何在亂世中從十五歲的迷茫少年，成長為太平道大賢良師，最終率三十六萬人起義。傳記體，四部三十章，約七萬字。在起義爆發的那一刻——戛然而止。</p>
